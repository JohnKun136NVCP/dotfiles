font_family MesloLGS Nerd Font Mono
bold_font MesloLGS Nerd Font Mono Bold
italic_font MesloLGS Nerd Font Mono Italic
bold_italic_font MesloLGS Nerd Font Mono Bold Italic
font_size 4.0

adjust_line_height 130%
adjust_column_width 120%
symbol_map U+E000-U+F8FF Symbols Nerd Font:size=15
symbol_map U+2600-U+26FF Symbols Nerd Font:size=15
symbol_map U+E000-U+F8FF Symbols Nerd Font:size=15
symbol_map U+E0A0-U+E0FF Symbols Nerd Font:size=15

# active_tab_foreground #f8f8f2
# active_tab_background #000000
# url_color #d65c9d

detect_urls yes
window_border_width 0.5pt
draw_minimal_borders yes
open_utl_with brave-browser


backbround_image_layout centered
background_image_linear yes
dynamic_background_opacity yes
background_opacity 0.7



# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME


# BEGIN_KITTY_FONTS
#font_family      family='MesloLGS Nerd Font Mono' postscript_name=MesloLGSNFM-Regular
#bold_font        family='MesloLGS Nerd Font Mono' postscript_name=MesloLGSNFM-Bold
#italic_font      family='MesloLGS Nerd Font Mono' postscript_name=MesloLGSNFM-Italic
#bold_italic_font family='MesloLGS Nerd Font Mono' postscript_name=MesloLGSNFM-BoldItalic
# END_KITTY_FONTS
